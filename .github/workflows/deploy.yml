name: Deploy to AWS EC2

# ─── Trigger ──────────────────────────────────────────────────────────────────
# Runs automatically on every push to main.
# Can also be triggered manually from the GitHub Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub UI

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Notify start ────────────────────────────────────────────────────
      - name: Deployment started
        run: echo "Deploying DECP Platform to EC2 at ${{ secrets.EC2_HOST }}"

      # ── 2. SSH into EC2 and run full deploy script ─────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 600s          # 10 min — first build takes time
          command_timeout: 600s
          script: |
            set -e   # exit immediately on any error

            echo "========================================"
            echo " DECP Platform — Auto Deploy"
            echo " Host : $(hostname)"
            echo " Date : $(date)"
            echo "========================================"

            # ── Step 1: Install Docker (skipped if already installed) ─────────
            if ! command -v docker &>/dev/null; then
              echo "[1/7] Installing Docker..."
              sudo apt-get update -y -q
              sudo apt-get install -y -q ca-certificates curl gnupg lsb-release
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
                sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y -q
              sudo apt-get install -y -q docker-ce docker-ce-cli containerd.io docker-compose-plugin
              sudo systemctl enable docker
              sudo systemctl start docker
              echo "[1/7] Docker installed."
            else
              echo "[1/7] Docker already installed — skipping."
            fi

            # ── Step 2: Clone or update repository ───────────────────────────
            APP_DIR="/home/${{ secrets.EC2_USER }}/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "[2/7] Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            else
              echo "[2/7] Pulling latest code..."
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/main
            fi
            cd "$APP_DIR"

            # ── Step 3: Write production environment file ────────────────────
            echo "[3/7] Writing docker-compose.env..."
            cat > docker-compose.env << 'EOF'
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}
            GOOGLE_CLOUD_PROJECT_ID=decp-project
            PUBSUB_EMULATOR_HOST=pubsub:8085
            PUBSUB_VERIFICATION_TOKEN=${{ secrets.PUBSUB_VERIFICATION_TOKEN }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
            FIREBASE_SERVICE_ACCOUNT_JSON=dummy
            AUTH_SERVICE_URL=http://auth:3001
            USER_SERVICE_URL=http://user:3002
            FEED_SERVICE_URL=http://feed:3003
            JOBS_SERVICE_URL=http://jobs:3004
            EVENTS_SERVICE_URL=http://events:3005
            NOTIFICATION_SERVICE_URL=http://notification:3007
            MESSAGING_SERVICE_URL=http://messaging:3006
            ANALYTICS_SERVICE_URL=http://analytics:3008
            RESEARCH_SERVICE_URL=http://research:3009
            REALTIME_SERVICE_URL=http://realtime:3010
            PUBSUB_TOPIC_USER_REGISTERED=decp.user.registered
            PUBSUB_TOPIC_POST_CREATED=decp.post.created
            PUBSUB_TOPIC_JOB_POSTED=decp.job.posted
            PUBSUB_TOPIC_JOB_APPLIED=decp.job.applied
            PUBSUB_TOPIC_EVENT_CREATED=decp.event.created
            PUBSUB_TOPIC_EVENT_RSVP=decp.event.rsvp
            EOF
            # Remove leading whitespace from heredoc
            sed -i 's/^[[:space:]]*//' docker-compose.env
            echo "[3/7] Environment file written."

            # ── Step 4: Pull latest Docker base images ───────────────────────
            echo "[4/7] Pulling base images..."
            sudo docker compose -f docker-compose.prod.yml pull --ignore-pull-failures 2>/dev/null || true

            # ── Step 5: Build and start all services ─────────────────────────
            echo "[5/7] Building and starting services..."
            sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            echo "[5/7] Services started."

            # ── Step 6: Run Pub/Sub setup (creates topics + push subscriptions)
            echo "[6/7] Waiting for Pub/Sub emulator to be ready..."
            sleep 15
            cd "$APP_DIR/scripts"
            if [ ! -d node_modules ]; then
              npm install --silent 2>/dev/null || true
            fi
            # Run setup pointing to the emulator exposed on localhost
            PUBSUB_EMULATOR_HOST=localhost:8085 \
            GOOGLE_CLOUD_PROJECT_ID=decp-project \
            node setup-pubsub.js 2>/dev/null || echo "[6/7] Pub/Sub setup skipped (already configured)."
            cd "$APP_DIR"

            # ── Step 7: Health checks ─────────────────────────────────────────
            echo "[7/7] Running health checks..."
            sleep 5

            GATEWAY_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/health || echo "000")
            REALTIME_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3010/health || echo "000")

            echo "  Gateway  /health → HTTP $GATEWAY_HEALTH"
            echo "  Realtime /health → HTTP $REALTIME_HEALTH"

            if [ "$GATEWAY_HEALTH" != "200" ]; then
              echo "WARNING: Gateway health check failed (HTTP $GATEWAY_HEALTH)"
              echo "Last 50 lines of gateway logs:"
              sudo docker logs decp-gateway --tail 50
            fi

            echo "========================================"
            echo " Deploy complete!"
            echo " API Gateway : http://${{ secrets.EC2_HOST }}:8082"
            echo " Realtime    : http://${{ secrets.EC2_HOST }}:3010"
            echo "========================================"
            sudo docker compose -f docker-compose.prod.yml ps
